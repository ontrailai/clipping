[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfactory"
version = "0.1.0"
description = "Automated GTA 6 short-form clip factory: discover, clip, edit, caption, and post 3 clips a day."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11",
  "pyyaml>=6",
  "requests>=2.31",
  "yt-dlp>=2025.1.1",
  "numpy>=1.26",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2"]
kick = ["curl_cffi>=0.7"]
dev = ["pytest>=8"]
all = [
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "curl_cffi>=0.7",
]

[project.scripts]
clipfactory = "clipfactory.cli:main"

[tool.setuptools.packages.find]
include = ["clipfactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
