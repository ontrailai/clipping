# Creators the Scout watches — copy to config/creators.yaml (`clipfactory init` does this)
#
# priority:   1 = check first / prefer when ranking, 3 = filler
# permission: granted | program | open | unverified
#   granted  = they (or their team) said yes
#   program  = they run a public clipping program (Whop Content Rewards, Discord clip bounties, ...)
#   open     = publicly encourages fan clips
#   unverified = not checked yet
#   Set discovery.require_permission: true in settings.yaml to only clip granted/program/open creators.
# sources:    any mix of youtube (@handle or UC... channel id), twitch (login), kick (slug)
# facecam:    optional fixed facecam box as fractions of the frame {x, y, w, h}; leave out to auto-detect
#
# Starter list of big GTA / GTA RP creators. Handles are best-effort — run `clipfactory doctor`
# to check each one resolves, and edit freely. GTA 6 launches Nov 19 2026: expect every major
# streamer to play it, so add the ones your audience follows.

creators:
  - name: xQc
    priority: 1
    permission: unverified
    credit: "@xqc"
    sources:
      - {platform: kick, id: xqc}
      - {platform: twitch, id: xqc}
      - {platform: youtube, id: "@xQcOW"}

